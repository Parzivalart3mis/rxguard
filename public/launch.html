<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching RxGuard...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #09111f; color: #94a3b8;
    }
    .container { text-align: center; }
    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #0d9488, #0f766e);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 { color: #f1f5f9; font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 0.875rem; color: #64748b; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e293b; border-top-color: #14b8a6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      display: none; margin-top: 20px;
      background: #450a0a; border: 1px solid #7f1d1d;
      border-radius: 10px; padding: 12px 16px;
      color: #fca5a5; font-size: 0.8rem; max-width: 360px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💊</div>
    <h1>RxGuard</h1>
    <p>Antibiotic Stewardship Plugin</p>
    <p style="margin-top:4px; font-size:0.8rem;">Connecting to EHR via SMART on FHIR...</p>
    <div class="spinner"></div>
    <div class="error" id="error-box"></div>
  </div>

  <!--
    fhirclient browser build — handles SMART on FHIR OAuth2 launch sequence.
    Must run as a standalone page (not bundled by Vite) so it can redirect
    before the React app loads.
  -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"></script>
  <script>
    FHIR.oauth2.authorize({
      clientId:    'rxguard-demo',
      scope:       'launch patient/*.read patient/MedicationRequest.write openid profile',
      redirectUri: window.location.origin + '/',
    }).catch(function(err) {
      document.querySelector('.spinner').style.display = 'none';
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = 'EHR connection failed: ' + (err.message || err);
    });
  </script>
</body>
</html>
